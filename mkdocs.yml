site_name: Linus's Notes
site_description: A course library of illustrated study notes, examples, and downloads.
site_url: https://linuso71.github.io/notes/
repo_url: https://github.com/linuso71/notes
repo_name: linuso71/notes
edit_uri: ""
docs_dir: docs
watch:
  - courses

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/notebook-outline
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  generator: false

extra_css:
  - stylesheets/courses.css

extra_javascript:
  - javascripts/youtube-links.js
  - javascripts/repository.js

plugins:
  - search

hooks:
  - hooks/courses.py
  - hooks/downloads.py

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    unrecognized_links: warn
